# ============================================================
# EAP 企业 Agent 平台 - Nginx 配置
# 部署路径: /home/wangyan/deploy/eap
# 前端 + API 统一在 /eap/ 路径下
# ============================================================

upstream eap_backend {
    server 127.0.0.1:5003;
}

server {
    listen 80;
    server_name 192.168.1.51;
    client_max_body_size 50M;

    # ===== EAP API（优先匹配）→ 后端 =====
    location /eap/api/ {
        proxy_pass http://eap_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 流式对话 — 禁用缓冲
    location /eap/api/v1/chat/stream {
        proxy_pass http://eap_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ===== EAP 前端 SPA =====
    # /eap/ 下所有非 API 请求 → 静态文件 + SPA fallback
    location /eap/ {
        alias /home/wangyan/deploy/eap/frontend/dist/;
        try_files $uri $uri/ /eap/index.html;
    }

    # ===== 健康检查 =====
    location /health {
        proxy_pass http://eap_backend;
        proxy_http_version 1.1;
    }
}
